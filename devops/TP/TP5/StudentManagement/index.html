<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Student Management</title></head>
<body>
  <h1>University Student Portal</h1>
  <p>Register and manage student information in one place.</p>
  <section id="registration">
    <h2>Student registration</h2>
    <form>
      <label for="student-name">Full name</label>
      <input id="student-name" name="name" autocomplete="name" required>
      <label for="student-email">Email</label>
      <input id="student-email" name="email" type="email" autocomplete="email" required>
      <button type="submit">Register</button>
    </form>
  </section>
  <section id="contact">
    <h2>Contact</h2>
    <p><a href="mailto:student-support@example.invalid">student-support@example.invalid</a> (demonstration address)</p>
  </section>
</body>
</html>
