<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angry Birds - Box2DWeb</title>
<!-- AI USED: this page was written with Claude Code (AI assistant).
     Prompt used: "read the newly added test for game dev, i want you to go on and solve it entirely for me"
     Then: "improve on it so when clicking 2 an entirely new version of the game is shown [...]
     and also make it that when hitting f the canvas is in full screen" (buttons, fullscreen style)
     Then: "for the new version make the ui more modern more facinating and concistent [...]
     not that pixelated" (page style, responsive sharp canvas) -->
<style>
:root {
    --bg: #0b1222;
    --panel: rgba(15, 23, 42, 0.7);
    --stroke: rgba(255, 255, 255, 0.12);
    --text: #f8fafc;
    --muted: rgba(226, 232, 240, 0.7);
    --accent: #fbbf24;
    --accent-dark: #f59e0b;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #1e3a8a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: var(--font);
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 32px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 0.2px; }
h1 span { color: var(--accent); }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

/* segmented control + buttons, same pill style as inside the game */
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
.controls button {
    font: 700 13px var(--font);
    color: var(--text);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--stroke);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
}
.controls button:hover { background: rgba(255, 255, 255, 0.16); transform: translateY(-1px); }
.controls button.on {
    color: #1f2937;
    background: linear-gradient(var(--accent), var(--accent-dark));
    border-color: transparent;
    box-shadow: 0 6px 18px rgba(245, 158, 11, 0.35);
}
.controls kbd {
    font: 700 11px var(--font);
    padding: 1px 6px;
    margin-right: 6px;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.2);
}

/* the canvas: as wide as possible, the real resolution is set by shell.js */
.stage {
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--stroke);
    box-shadow: 0 30px 60px rgba(2, 6, 23, 0.55);
    background: #000;
}
#canvas { display: block; width: 100%; height: auto; background-color: #e6f2ff; }
/* fullscreen: keep the proportions, black bands on the sides */
#canvas:fullscreen { width: 100%; height: 100%; object-fit: contain; background-color: #000; }
#canvas:-webkit-full-screen { width: 100%; height: 100%; object-fit: contain; background-color: #000; }

.help { margin-top: 14px; color: var(--muted); font-size: 13px; text-align: center; }
.help b { color: var(--text); }
</style>
<script type="text/javascript" src="Box2d.min.js"></script>
<script type="text/javascript" src="sound.js"></script>
<script type="text/javascript" src="shell.js"></script>
</head>

<body onload="init(); init2();">
<div class="wrap">
    <header>
        <div>
            <h1>Angry <span>Birds</span></h1>
            <p class="sub">HTML5 Canvas &middot; Box2DWeb physics</p>
        </div>
        <div class="controls">
            <button id="btn1" onclick="switchVersion(1)"><kbd>1</kbd>Classic (midterm)</button>
            <button id="btn2" onclick="switchVersion(2)"><kbd>2</kbd>New version</button>
            <button onclick="toggleFullscreen()"><kbd>F</kbd>Fullscreen</button>
        </div>
    </header>
    <div class="stage">
        <canvas id="canvas" width="800" height="450"></canvas>
    </div>
    <p class="help">Click on the red bird, <b>drag it backwards</b> and <b>release</b> to launch it &middot; <b>R</b> restart</p>
</div>
<script type="text/javascript" src="main.js"></script>
<script type="text/javascript" src="game2.js"></script>
</body>
</html>
