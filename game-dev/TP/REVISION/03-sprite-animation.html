<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>03 - Sprite animation</title>
</head>
<body>
<canvas id="c" width="400" height="200" style="border:1px solid black"></canvas>
<p>Left/Right arrows: walk. The sheet is generated by code so this file needs no image. With a real sheet use <code>sheet.src = "sprite.png"</code>.</p>
<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---------- A spritesheet: 4 columns (frames) x 2 rows (row 0 = right, row 1 = left) ----------
// In the exam you load a PNG instead:  var sheet = new Image(); sheet.src = "sheet.png";
var FRAME_W = 32, FRAME_H = 32, NB_FRAMES = 4;
var sheet = document.createElement("canvas");
sheet.width = FRAME_W * NB_FRAMES;
sheet.height = FRAME_H * 2;
(function makeSheet() {
    var s = sheet.getContext("2d");
    for (var row = 0; row < 2; row++) {
        for (var f = 0; f < NB_FRAMES; f++) {
            var x = f * FRAME_W, y = row * FRAME_H;
            s.fillStyle = "#3f51b5"; s.fillRect(x + 8, y + 4, 16, 16);          // body
            s.fillStyle = "#fff";    s.fillRect(x + (row === 0 ? 18 : 10), y + 8, 4, 4); // eye
            s.fillStyle = "#222";                                                 // legs move with the frame
            var swing = [0, 4, 0, -4][f];
            s.fillRect(x + 10 + swing, y + 20, 5, 10);
            s.fillRect(x + 17 - swing, y + 20, 5, 10);
        }
    }
})();

// ---------- State ----------
var hero = { x: 150, y: 120, speed: 120, row: 0, moving: false };
var frame = 0;                 // current column
var FRAME_DURATION = 100;      // ms per frame  -> 10 frames per second
var frameTimer = 0;            // time accumulated since the last frame change

var keys = {};
document.addEventListener("keydown", function (e) { keys[e.key] = true; });
document.addEventListener("keyup",   function (e) { keys[e.key] = false; });

function update(dt, dtMs) {
    hero.moving = false;
    if (keys["ArrowRight"]) { hero.x += hero.speed * dt; hero.row = 0; hero.moving = true; }
    if (keys["ArrowLeft"])  { hero.x -= hero.speed * dt; hero.row = 1; hero.moving = true; }

    if (hero.moving) {
        frameTimer += dtMs;
        if (frameTimer >= FRAME_DURATION) {          // time to change the frame
            frameTimer -= FRAME_DURATION;
            frame = (frame + 1) % NB_FRAMES;         // 0,1,2,3,0,1,...
        }
    } else {
        frame = 0;                                   // standing frame
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#8bc34a";
    ctx.fillRect(0, 152, canvas.width, 48);          // ground

    // drawImage(image, sx, sy, sw, sh, dx, dy, dw, dh)
    //   source rectangle in the sheet: column * frameWidth, row * frameHeight
    //   destination: where on the canvas (and what size, here x2)
    ctx.drawImage(sheet,
        frame * FRAME_W, hero.row * FRAME_H, FRAME_W, FRAME_H,
        hero.x, hero.y - 32, FRAME_W * 2, FRAME_H * 2);
}

var last = 0;
function loop(now) {
    var dtMs = Math.min(now - last, 100);
    last = now;
    update(dtMs / 1000, dtMs);
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(function (t) { last = t; loop(t); });
</script>
</body>
</html>
