<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Iso Character</title>
</head>

<body>

<canvas id="game" width="800" height="400">
    Your browser does not support HTML5 Canvas.
</canvas>

<script>

// Character spritesheet: 4 rows (directions) x 4 columns (animation frames), 32x32 each
var Character = new Image();
Character.src = "Character0_Run.png";

var frameW = 32;
var frameH = 32;

// Row of the spritesheet for each direction on screen
var DIR_DOWN_LEFT  = 0;
var DIR_UP_LEFT    = 1;
var DIR_DOWN_RIGHT = 2;
var DIR_UP_RIGHT   = 3;

var direction = DIR_DOWN_RIGHT;
var frame = 0;

// Character position on the isometric grid
var rx = 0;
var ry = 0;

// Isometric grid dimensions
var tileW = 49;
var tileH = 25;

// Canvas position offset
var mapX = 300;
var mapY = 150;

// Grid boundaries (invisible grid)
var maxRows = 6;
var maxCols = 4;


// Draw the character
function drawCharacter() {

    var canvas = document.getElementById("game");
    var ctx = canvas.getContext("2d");

    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Convert isometric coordinates to screen coordinates
    var x = (rx - ry) * tileW / 2 + mapX;
    var y = (rx + ry) * tileH / 2 + mapY;

    // Draw the current frame of the current direction, with the feet at the grid position
    ctx.drawImage(
        Character,
        frame * frameW, direction * frameH, frameW, frameH,
        x - frameW / 2,
        y + tileH / 2 - frameH,
        frameW,
        frameH
    );
}


// Wait until the image is loaded
Character.onload = function() {
    drawCharacter();
};


// Keyboard controls: each key sets the direction, moves on the grid and plays the next frame
addEventListener("keydown", function(e) {

    switch(e.keyCode) {

        case 37: // Left: down-left on screen
            direction = DIR_DOWN_LEFT;
            if (ry < maxCols - 1)
                ry++;
            break;

        case 39: // Right: up-right on screen
            direction = DIR_UP_RIGHT;
            if (ry > 0)
                ry--;
            break;

        case 38: // Up: up-left on screen
            direction = DIR_UP_LEFT;
            if (rx > 0)
                rx--;
            break;

        case 40: // Down: down-right on screen
            direction = DIR_DOWN_RIGHT;
            if (rx < maxRows - 1)
                rx++;
            break;

        default:
            return;
    }

    frame = (frame + 1) % 4;

    e.preventDefault();
    drawCharacter();

});

</script>

</body>
</html>
